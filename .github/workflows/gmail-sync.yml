name: Gmail sync
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      since_days:
        description: 'rpinvoicing catch-up window in days (one-time manual backfill only — leave as 14 for a normal run)'
        default: '14'
      until_days:
        description: 'Optional — pairs with since_days to slice a big backfill into dated chunks (e.g. since_days=60 until_days=30 = the 30-60 days ago slice). Leave blank for a normal run.'
        default: ''
      max:
        description: 'Max rpinvoicing messages to process in this run'
        default: '50'

permissions:
  contents: read

concurrency:
  group: gmail-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hit /api/gmail/sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body -sS --max-time 90 \
            -w "\nHTTP %{http_code}\n" \
            "https://rps-maintenance.vercel.app/api/gmail/sync?secret=$CRON_SECRET&max=30"


  svc-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sync rpdispatcher (create/update work orders)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body -sS --max-time 90 \
            -w "\nHTTP %{http_code}\n" \
            "https://rps-maintenance.vercel.app/api/svc/gmail-sync?secret=$CRON_SECRET&pass=dispatcher"
      - name: Sync rpinvoicing (completion status + ticket attachments)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SINCE_DAYS: ${{ github.event.inputs.since_days || '14' }}
          UNTIL_DAYS: ${{ github.event.inputs.until_days || '' }}
          MAX_MSGS: ${{ github.event.inputs.max || '50' }}
        run: |
          URL="https://rps-maintenance.vercel.app/api/svc/gmail-sync?secret=$CRON_SECRET&pass=invoicing&sinceDays=$SINCE_DAYS&max=$MAX_MSGS"
          if [ -n "$UNTIL_DAYS" ]; then URL="$URL&untilDays=$UNTIL_DAYS"; fi
          curl --fail-with-body -sS --max-time 90 -w "\nHTTP %{http_code}\n" "$URL"
      - name: Draft transcripts for newly captured tickets
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body -sS --max-time 90 \
            -w "\nHTTP %{http_code}\n" \
            "https://rps-maintenance.vercel.app/api/svc/gmail-sync?secret=$CRON_SECRET&pass=extract-docs&limit=5"

  billing-inbox-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pull paperwork from the billing inboxes
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body -sS --max-time 90 \
            -w "\nHTTP %{http_code}\n" \
            "https://rps-maintenance.vercel.app/api/billing/inbox-sync?secret=$CRON_SECRET&pass=sync&max=30"
      - name: Read pending documents
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body -sS --max-time 90 \
            -w "\nHTTP %{http_code}\n" \
            "https://rps-maintenance.vercel.app/api/billing/inbox-sync?secret=$CRON_SECRET&pass=extract&limit=3"
