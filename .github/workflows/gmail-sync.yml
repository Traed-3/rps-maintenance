name: Gmail sync
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      since_days:
        description: 'rpinvoicing catch-up window in days (one-time manual backfill only — leave as 14 for a normal run)'
        default: '14'
      until_days:
        description: 'Optional — pairs with since_days to slice a big backfill into dated chunks (e.g. since_days=60 until_days=30 = the 30-60 days ago slice). Leave blank for a normal run.'
        default: ''
      max:
        description: 'Max rpinvoicing messages to process in this run'
        default: '50'
      lookup_q:
        description: 'Optional — raw Gmail query for a read-only rpinvoicing lookup (e.g. subject:(WOT1 OR WOT2)), no date crawl. Leave blank for a normal run.'
        default: ''
      archive_stale_days:
        description: 'Optional — archive work orders older than this many days with no rpinvoicing mail ever and no system update in that window. Leave blank for a normal run.'
        default: ''
      archive_stale_apply:
        description: 'Set to 1 to actually archive (default is a dry-run preview only).'
        default: ''
      archive_stale_archived_by:
        description: 'Optional — profile id to record as archived_by on the archived rows.'
        default: ''
      backfill_permits_offset:
        description: 'Optional — one-time historical permit-email backfill (econstruction). Site offset to start this batch at (0 for the first run). Leave blank for a normal run.'
        default: ''
      backfill_permits_limit:
        description: 'How many sites to process in this batch (Gmail fetches are slow — keep this small, default 5).'
        default: '5'
      backfill_permits_apply:
        description: 'Set to 1 to actually file/link (default is a dry-run preview only).'
        default: ''

permissions:
  contents: read

concurrency:
  group: gmail-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hit /api/gmail/sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body -sS --max-time 90 \
            -w "\nHTTP %{http_code}\n" \
            "https://rps-maintenance.vercel.app/api/gmail/sync?secret=$CRON_SECRET&max=30"


  svc-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sync rpdispatcher (create/update work orders)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body -sS --max-time 90 \
            -w "\nHTTP %{http_code}\n" \
            "https://rps-maintenance.vercel.app/api/svc/gmail-sync?secret=$CRON_SECRET&pass=dispatcher"
      - name: Sync rpinvoicing (completion status + ticket attachments)
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SINCE_DAYS: ${{ github.event.inputs.since_days || '14' }}
          UNTIL_DAYS: ${{ github.event.inputs.until_days || '' }}
          MAX_MSGS: ${{ github.event.inputs.max || '50' }}
        run: |
          URL="https://rps-maintenance.vercel.app/api/svc/gmail-sync?secret=$CRON_SECRET&pass=invoicing&sinceDays=$SINCE_DAYS&max=$MAX_MSGS"
          if [ -n "$UNTIL_DAYS" ]; then URL="$URL&untilDays=$UNTIL_DAYS"; fi
          curl --fail-with-body -sS --max-time 90 -w "\nHTTP %{http_code}\n" "$URL"
      - name: Draft transcripts for newly captured tickets
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body -sS --max-time 90 \
            -w "\nHTTP %{http_code}\n" \
            "https://rps-maintenance.vercel.app/api/svc/gmail-sync?secret=$CRON_SECRET&pass=extract-docs&limit=5"

  svc-lookup:
    if: ${{ github.event.inputs.lookup_q != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read-only rpinvoicing lookup
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          LOOKUP_Q: ${{ github.event.inputs.lookup_q }}
        run: |
          curl -G --fail-with-body -sS --max-time 90 \
            --data-urlencode "secret=$CRON_SECRET" \
            --data-urlencode "pass=lookup" \
            --data-urlencode "q=$LOOKUP_Q" \
            --data-urlencode "full=1" \
            -w "\nHTTP %{http_code}\n" \
            "https://rps-maintenance.vercel.app/api/svc/gmail-sync"

  svc-archive-stale:
    if: ${{ github.event.inputs.archive_stale_days != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Archive stale work orders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DAYS: ${{ github.event.inputs.archive_stale_days }}
          APPLY: ${{ github.event.inputs.archive_stale_apply }}
          ARCHIVED_BY: ${{ github.event.inputs.archive_stale_archived_by }}
        run: |
          URL="https://rps-maintenance.vercel.app/api/svc/gmail-sync?secret=$CRON_SECRET&pass=archive-stale&days=$DAYS"
          if [ "$APPLY" = "1" ]; then URL="$URL&apply=1"; fi
          if [ -n "$ARCHIVED_BY" ]; then URL="$URL&archivedBy=$ARCHIVED_BY"; fi
          curl --fail-with-body -sS --max-time 90 -w "\nHTTP %{http_code}\n" "$URL"

  billing-permit-backfill:
    if: ${{ github.event.inputs.backfill_permits_offset != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Backfill historical permit emails from econstruction
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          OFFSET: ${{ github.event.inputs.backfill_permits_offset }}
          LIMIT: ${{ github.event.inputs.backfill_permits_limit }}
          APPLY: ${{ github.event.inputs.backfill_permits_apply }}
        run: |
          URL="https://rps-maintenance.vercel.app/api/billing/inbox-sync?secret=$CRON_SECRET&pass=backfill-permits&offset=$OFFSET&limit=$LIMIT"
          if [ "$APPLY" = "1" ]; then URL="$URL&apply=1"; fi
          curl --fail-with-body -sS --max-time 90 -w "\nHTTP %{http_code}\n" "$URL"

  billing-inbox-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pull paperwork from the billing inboxes
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body -sS --max-time 90 \
            -w "\nHTTP %{http_code}\n" \
            "https://rps-maintenance.vercel.app/api/billing/inbox-sync?secret=$CRON_SECRET&pass=sync&max=30"
      - name: Read pending documents
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body -sS --max-time 90 \
            -w "\nHTTP %{http_code}\n" \
            "https://rps-maintenance.vercel.app/api/billing/inbox-sync?secret=$CRON_SECRET&pass=extract&limit=3"
